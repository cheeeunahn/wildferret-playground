name: Preview link

# Cloudflare builds a preview of every pull request branch. Its bot (on the
# open-beta "Previews") comments once, but does not update that comment on
# later pushes, so it goes stale. This keeps one comment current instead: it
# waits for the Workers Builds check on the PR's latest commit and updates the
# comment with the result and the branch's preview link.
#
# The link is behind Cloudflare Access, so it opens for people that policy
# lets in, not for everyone.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # A newer push replaces the run waiting on the previous commit.
  group: preview-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    # A fork's token cannot comment, and a fork's branch is not built anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: read
      pull-requests: write
    steps:
      - name: Wait for the Cloudflare build and post the link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through env, never an expression inside the script: a branch name
          # is user input, and an expression is pasted into the shell source.
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          WORKER: wildferret-playground
          SUBDOMAIN: cheeeunahn
        run: |
          set -euo pipefail

          # The preview's name is the branch name as a hostname label:
          # lower-case, anything else becomes "-". Cloudflare does not
          # document the exact rule; this matches the previews seen so far
          # (feat/anime-tracker-experiment -> feat-anime-tracker-experiment).
          # A label may be 63 characters, and "-$WORKER" takes part of that.
          name=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          max=$((63 - ${#WORKER} - 1))
          name=$(printf '%s' "${name:0:$max}" | sed -E 's/-+$//')
          url="https://${name}-${WORKER}.${SUBDOMAIN}.workers.dev"

          # Wait for Cloudflare's check on this exact commit.
          conclusion=''
          for _ in $(seq 1 90); do
            run=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name | startswith("Workers Builds"))][0] // empty')
            if [ -n "$run" ] && [ "$(jq -r .status <<<"$run")" = completed ]; then
              conclusion=$(jq -r .conclusion <<<"$run")
              logs=$(jq -r .details_url <<<"$run")
              break
            fi
            sleep 10
          done

          case "$conclusion" in
            success) status="✅ Preview ready: **[${url#https://}](${url})**" ;;
            '') status="⏳ The Cloudflare build had not finished after 15 minutes. Once it does, the preview will be at ${url}" ;;
            *) status="❌ The Cloudflare build ended as \`${conclusion}\`, so the preview was not updated. [Build logs](${logs})" ;;
          esac

          marker='<!-- preview-link -->'
          body="$marker
          ### Preview
          $status

          Commit \`${SHA:0:7}\` on \`${BRANCH}\`. The link is behind Cloudflare Access sign-in."

          # One comment per PR, edited in place on every push.
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
